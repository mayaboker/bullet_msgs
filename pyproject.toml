[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullet-msgs"
version = "0.1.0"
description = "Bullet shared message contracts and local SHM image transport"
requires-python = ">=3.12"
dependencies = ["pyzmq>=27,<28"]

[dependency-groups]
dev = ["pytest>=9,<10", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
